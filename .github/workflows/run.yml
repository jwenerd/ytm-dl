name: run

on:
  repository_dispatch:
    types:
      - all
      - frequent
  workflow_dispatch:
    inputs:
      run_option:
        description: 'Run Option'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frequent
  schedule:
    - cron: '19 0,6,9,12,15,18,21 * * *'
    - cron: '19 3 * * *'

concurrency:
  group: ytm-output-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: ${{ github.event_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: pip install -r requirements.txt
      - name: Secrets 🔒 🤫
        env:
          YTM_BROWSER_AUTH: ${{ secrets.YTM_BROWSER_AUTH || secrets.BROWSER_AUTH_JSON }}
          YTM_OAUTH: ${{ secrets.YTM_OAUTH }}
        run: |
          if [ -n "$YTM_BROWSER_AUTH" ]; then
            echo "$YTM_BROWSER_AUTH" > browser.json
          elif [ -n "$YTM_OAUTH" ]; then
            echo "$YTM_OAUTH" > oauth.json
          fi
      - name: Validate Auth 🔑
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          echo "::group::Validate YTM Authentication"
          python ytm-dl.py auth
          echo "::endgroup::"
      - name: Setup Output Worktree
        run: |
          echo "::group::Setup main-output worktree"
          git fetch origin main-output:main-output --depth=1
          rm -rf output
          git worktree add ../output-worktree main-output
          ln -s ../output-worktree/output output
          echo "::endgroup::"
      - name: Run 🎶
        id: run
        env:
          INPUT_RUN_OPTION: ${{ inputs.run_option }}
          SCHEDULE_RUN_OPTION: ${{ github.event.schedule != '19 3 * * *' && 'frequent' || 'all' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ secrets.YTM_GITHUB_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          true || 🚀
          echo "::group::RUN_OPTION"

          RUN_OPTION='all'
          [[ -n $SCHEDULE_RUN_OPTION ]] && RUN_OPTION=$SCHEDULE_RUN_OPTION
          [[ -n $INPUT_RUN_OPTION ]] && RUN_OPTION=$INPUT_RUN_OPTION

          echo "github.event.schedule = $GITHUB_EVENT_SCHEDULE"
          echo "RUN_OPTION = $RUN_OPTION"
          echo "INPUT_RUN_OPTION = $INPUT_RUN_OPTION"
          echo "SCHEDULE_RUN_OPTION = $SCHEDULE_RUN_OPTION"
          echo "RUN_OPTION=$RUN_OPTION" >> $GITHUB_ENV
          echo "::endgroup::"

          echo "::group::python ytm-dl.py $RUN_OPTION"
          python ytm-dl.py $RUN_OPTION > $HOME/run_output
          cat $HOME/run_output
          echo "::endgroup::"

          if [ -f oauth.json ]; then
            echo "::group::update oauth secret"
            gh secret set YTM_OAUTH < oauth.json
            echo "Updated secret."
            echo "::endgroup::"
          fi

          echo "::group::github step summary"
          if [ -f "./tmp/step_output/auth_info.md" ]; then
            cat "./tmp/step_output/auth_info.md" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### ⚙️ python ytm-dl.py $RUN_OPTION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat $HOME/run_output  >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in ./tmp/step_output/*.md; do
            [ -e "$file" ] || continue
            [ "$file" = "./tmp/step_output/auth_info.md" ] && continue
            cat "$file" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done
          echo "::endgroup::"

          echo "::group::determine if need to commit to output"
          if [ -n "$(git -C ../output-worktree status --porcelain output/)" ]; then
            echo "DOCOMMIT=1" >> "$GITHUB_OUTPUT"
            echo "Changes detected in output/ - will commit."
          else
            echo "No changes detected in output/."
          fi
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: api_results
          path: artifacts/api_results_*
          if-no-files-found: ignore
      - name: Commit Changes
        id: commit
        if: ${{ steps.run.outputs.DOCOMMIT == '1' }}
        run: |
          true || 👨‍💻
          echo "::group::commit & push main-output"
          cd ../output-worktree

          git config --global core.autocrlf input
          git config --global user.name "GitHub Actions"
          git config --global user.email "<>"

          git add -A output/
          if ! git diff-index --quiet HEAD output/; then
            COMMIT_MSG_FILE="$GITHUB_WORKSPACE/tmp/commit_message.txt"
            if [ -f "$COMMIT_MSG_FILE" ]; then
              git commit -F "$COMMIT_MSG_FILE"
            else
              git commit --message="$GITHUB_JOB($RUN_OPTION) $GITHUB_EVENT_NAME #$GITHUB_RUN_NUMBER"
            fi
            git pull --rebase origin main-output || true
            git push origin main-output

            OUTPUT_COMMIT=$(git rev-parse HEAD)
            if [ -f "$GITHUB_WORKSPACE/tmp/commit_link.md" ]; then
              sed "s/__OUTPUTCOMMIT__/$OUTPUT_COMMIT/g" "$GITHUB_WORKSPACE/tmp/commit_link.md" >> $GITHUB_STEP_SUMMARY
              sed "s/__OUTPUTCOMMIT__/$OUTPUT_COMMIT/g" "$GITHUB_WORKSPACE/tmp/commit_link.md"
            fi
          fi
          echo "::endgroup::"

          echo "::group::tag latest-output"
          git tag --force latest-output
          git push --force origin latest-output
          echo "::endgroup::"
      - name: Update Google Sheets
        id: update-google-sheets
        if: ${{ steps.run.outputs.DOCOMMIT == '1' }}
        env:
          YTM_SHEET_UPDATE_URL: ${{ secrets.YTM_SHEET_UPDATE_URL }}
        run: |
          true || 🫡
          curl -s -L -d '' $YTM_SHEET_UPDATE_URL
