[project]
name = "ytm-dl"
version = "0.1.0"
description = "Download and sync YouTube Music library, history, likes, and recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marshmallow>=4.0.0",
    "py-markdown-table>=1.3.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "ytmusicapi>=1.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".vscode",
    "artifacts",
    "output",
    "tmp",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
