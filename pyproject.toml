[project]
name = "ytm-dl"
version = "0.1.0"
description = "Download and sync YouTube Music library, history, likes, and recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marshmallow>=4.0.0",
    "py-markdown-table>=1.3.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "ytmusicapi>=1.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".vscode",
    "artifacts",
    "output",
    "tmp",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "RUF001", # ambiguous unicode characters (emojis and symbols in reports)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*urllib3.*:Warning",
]

[tool.coverage.run]
source = ["src", "scripts"]
omit = [
    "tests/*",
    "src/cloud_functions/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
    "except ImportError:",
]
